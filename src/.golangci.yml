version: "2"

linters:
  default: standard
  enable:
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: '^time\.(Now|Since)$'
        - pattern: '^(math/)?rand\.'
        - pattern: '^crypto/rand\.'
        - pattern: '^os\.(Getenv|Args|Hostname|Getpid)$'
        - pattern: '^runtime\.NumGoroutine$'
        - pattern: '^net\.(Dial|Listen)$'
  exclusions:
    generated: lax
    rules:
      # forbidigo is scoped to _test.go (testing-strategy §7). The oracle itself
      # must reach the clock, env, and filesystem; its *tests* must not, or the
      # suite acquires the non-determinism §6 exists to keep out.
      - path-except: '_test\.go$'
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
